<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results Summary Component</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <div class="result">
            <p class="header-text">Your Result</p>
            <div class="score">
                <p>76</p>
                <p>of 100</p>
            </div>
            <p>Great</p>
            <p>You scored higher than 65% of the people who have taken these tests.</p>
        </div>
        <div class="summary">
            <p class="header-text">Summary</p>
            <ul>
                <li><span><img src="assets/images/icon-reaction.svg" alt="">Reaction</span> <p><b>80</b> / 100</p></li>
                <li><span><img src="assets/images/icon-memory.svg" alt="">Memory</span> <p><b>90</b> / 100</p></li>
                <li><span><img src="assets/images/icon-verbal.svg" alt="">Verbal</span> <p><b>61</b> / 100</p></li>
                <li><span><img src="assets/images/icon-visual.svg" alt="">Visual</span> <p><b>73</b> / 100</p></li>
            </ul>

            <a href="#">Continue</a>
        </div>
    </main>
</body>
</html>
