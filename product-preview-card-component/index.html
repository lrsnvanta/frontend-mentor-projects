<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Product preview card component</title>
</head>
<body>

  <main>

    <img src="./assets/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum">
    <img src="./assets/image-product-desktop.jpg" alt="Gabrielle Essence Eau De Parfum">
    <div class="description">
      <p>Perfume</p>

      <h1>Gabrielle Essence Eau De Parfum</h1>

      <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.</p>
      
      <div class="price">
        <p>$149.99</p>
        <p>$169.99</p>
      </div>

      <a href="#"><img class='cart' src="./assets/icon-cart.svg" alt="">Add to Cart</a>
    </div>
  </main>
  
</body>
</html>
